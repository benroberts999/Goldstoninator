[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "goldstoninator"
version = "0.1.0"
description = "Goldstone and Feynman diagrams for many-body perturbation theory, drawn from a line of text, with the perturbation term and its angular reduction"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Benjamin M. Roberts" }]
requires-python = ">=3.8"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/benroberts999/Goldstoninator"

[tool.hatch.build.targets.wheel]
packages = ["goldstoninator"]
